# Supabase met en pause les projets gratuits après 7 jours sans activité.
# Ce petit appel, deux fois par semaine, garde la base éveillée entre deux dimanches.
name: Garder la base active

on:
  schedule:
    - cron: "17 6 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler la base
        run: |
          curl --fail --silent --show-error -X POST \
            "https://kqvokelswprmxjasbeyv.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_ver6w3cjylp0MieKgbB1aQ_J-5WOR1N" \
            -H "Content-Type: application/json" -d '{}'
